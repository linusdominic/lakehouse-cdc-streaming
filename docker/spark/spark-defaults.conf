# Single-container local mode sized for a laptop. Heap plus everything the JVM
# allocates outside it has to stay under the container's 1900m limit, so the
# off-heap areas are capped explicitly; left alone they grew past the limit
# and the job spent its time swapping.
spark.master                              local[4]
spark.driver.memory                       1100m
spark.driver.extraJavaOptions             -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=256m
spark.sql.shuffle.partitions              4
spark.sql.session.timeZone                UTC
spark.ui.port                             4040
spark.ui.retainedJobs                     50
spark.ui.retainedStages                   50
spark.sql.ui.retainedExecutions           20
spark.sql.streaming.ui.retainedBatches    20

spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type               rest
spark.sql.catalog.lake.uri                http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse          s3://warehouse/
spark.sql.catalog.lake.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint        http://minio:9000
spark.sql.catalog.lake.s3.path-style-access true

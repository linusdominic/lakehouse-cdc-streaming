version: 2

sources:
  - name: silver
    description: >
      Current-state tables maintained by the Spark streaming job with an
      LSN-guarded MERGE. Hard deletes at the source are kept as tombstone rows
      (_is_deleted = true); staging filters them out.
    database: lake
    schema: silver
    loaded_at_field: _silver_ts
    freshness:
      warn_after: { count: 1, period: hour }
    tables:
      - name: borrowers
        columns:
          - name: borrower_id
            data_tests: [not_null]
      - name: loans
        columns:
          - name: loan_id
            data_tests: [not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [not_null]
      - name: loan_status_history
        description: Status changes as recorded by the servicing application itself.
      - name: loan_status_scd2
        description: >
          Status versions derived from the CDC stream of loans.status, one row
          per (loan_id, valid_from_lsn). A loan deleted at the source ends in
          a DELETED version.
        freshness: null

version: 2

models:
  - name: stg_borrowers
    description: Live borrowers (tombstones removed).
    columns:
      - name: borrower_id
        data_tests: [unique, not_null]
  - name: stg_loans
    description: Live loans (tombstones removed).
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: borrower_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_borrowers')
                field: borrower_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [CURRENT, DPD_30, DPD_60, DPD_90, DEFAULT, PAID_OFF, CHARGED_OFF]
  - name: stg_payments
    description: Live payments. `channel` is null for rows written before the source added the column.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [POSTED, REVERSED]
  - name: stg_loan_status_versions
    description: SCD2 status versions, including loans that were later deleted at the source.
    columns:
      - name: loan_id
        data_tests: [not_null]
      - name: valid_from_lsn
        data_tests: [not_null]

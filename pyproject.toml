[project]
name = "lakehouse-cdc-streaming"
version = "0.1.0"
description = "CDC lakehouse for a loan-servicing OLTP system: Postgres -> Debezium -> Redpanda -> Spark Structured Streaming -> Iceberg -> Trino -> dbt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Linus Dominic Nathaniel" }]
dependencies = [
    "click>=8.1",
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "trino>=0.330",
]

[project.scripts]
cdc = "lakehouse_cdc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
dbt = [
    "dbt-core>=1.10.8,<1.11",
    "dbt-trino>=1.10,<1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_cdc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = ["spark: runs inside the Spark container (make test-spark)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # the checksum NULL marker is a deliberate non-ASCII character
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
